name: Build and push Docker container

on:
  workflow_dispatch:
    inputs:
      preview:
        default: false
        description: Mark this build as preview (stable builds are tagged as latest)
        type: boolean

env:
  IMAGE: ghcr.io/grossherzogin-elisabeth/eventplanner
  # Images are only pushed from main, all other branches do a dry run
  PUSH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build-and-push-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          frontend_version=$(jq -r '.version // empty' frontend/package.json)
          gradle_version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' backend/build.gradle | head -n 1)
          # Gradle versions may carry a -SNAPSHOT suffix during development
          backend_version="${gradle_version%-SNAPSHOT}"

          echo "frontend/package.json: ${frontend_version:-<not found>}"
          echo "backend/build.gradle:  ${gradle_version:-<not found>}"

          if [[ -z "$frontend_version" || -z "$backend_version" ]]; then
            echo "::error::Could not read version from frontend/package.json or backend/build.gradle"
            exit 1
          fi
          if [[ "$frontend_version" != "$backend_version" ]]; then
            echo "::error::Version mismatch: frontend/package.json has '$frontend_version', backend/build.gradle has '$gradle_version'"
            exit 1
          fi
          if ! [[ "$frontend_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version '$frontend_version' is not in the format <major>.<minor>.<patch>"
            exit 1
          fi

          {
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[2]}"
            echo "patch=${BASH_REMATCH[3]}"
          } >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: meta
        shell: bash
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          PATCH: ${{ steps.version.outputs.patch }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          version="$MAJOR.$MINOR.$PATCH"
          if [[ "$PREVIEW" == "true" ]]; then
            tags=("$version-preview" "preview")
          else
            tags=("$version" "$MAJOR.$MINOR" "$MAJOR" "latest")
          fi

          {
            echo "date=$(date '+%Y-%m-%d %H:%M:%S')"
            echo "tags<<EOF"
            printf "$IMAGE:%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Image tags:"
          printf "$IMAGE:%s\n" "${tags[@]}"

          if [[ "$PUSH" == "true" ]]; then
            echo "### Pushing image" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Dry run: images are only pushed from main, not from $GITHUB_REF_NAME"
            echo "### Dry run (branch \`$GITHUB_REF_NAME\`), image is built but not pushed" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf -- "- \`$IMAGE:%s\`\n" "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # https://github.com/docker/login-action
      - name: Log into ghcr registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: |
            COMMIT=${{ github.sha }}
            BRANCH=${{ github.head_ref || github.ref_name }}
            TIME=${{ steps.meta.outputs.date }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
