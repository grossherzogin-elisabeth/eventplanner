# https://docs.spring.io/spring-boot/appendix/application-properties/index.html

backend:
  protocol: ${PROTOCOL:https}
  host: ${HOST:localhost}
  port: ${PORT:80}
  url: ${HOST_URL:${backend.protocol}://${backend.host}:${backend.port}}

frontend:
  protocol: ${backend.protocol}
  host: ${backend.host}
  port: ${backend.port}
  url: ${HOST_URL:${frontend.protocol}://${frontend.host}:${frontend.port}}

build:
  time: ${BUILD_DATE:now}
  commit: ${BUILD_COMMIT:local}
  branch: ${BUILD_BRANCH:main}

notifications:
  added-to-waiting-list:
    enabled: true
  removed-from-waiting-list:
    enabled: true
  added-to-crew:
    enabled: true
  removed-from-crew:
    enabled: true
  confirm-participation-request:
    enabled: true
  confirm-participation-reminder:
    enabled: true
  crew-registration-canceled:
    enabled: true
  crew-registration-added:
    enabled: true
  user-data-changed:
    enabled: true
  qualification-added:
    enabled: true
  qualification-updated:
    enabled: true
  qualification-removed:
    enabled: true
  qualification-close-to-expired:
    enabled: false
  qualification-expired:
    enabled: false

email:
  enabled: true
  # If not empty, email notifications will only be sent to these email addresses
  recipients-whitelist: ${EMAIL_WHITELIST:}
  # Adds a prefix to the subject of all emails sent by the application
  title-prefix: ${EMAIL_PREFIX:}

auth:
  logout-success-url: ${frontend.url}/login
  login-success-url: ${frontend.url}
  # OIDC users with this email address in their token will automatically become admins
  admins: ${ADMIN_EMAILS:}
  session:
    # 60 * 60 * 24 * 30 seconds = 30 days
    timeout: 2592000
  access-key:
    # Secret used to hash access keys before they are stored in the database
    hash-secret: ${ACCESS_KEY_HASH_SECRET:default-access-key-hash-secret}
    # Maximum age for access keys before scheduled cleanup removes them
    max-age: ${ACCESS_KEY_EXPIRATION:P21D}
  csrf:
    enabled: ${CSRF_ENABLED:true}

templates:
  directory: ${data.directory}/templates/excel

data:
  directory: ${DATA_DIRECTORY:data}
  # the password to use for encrypting sensible data
  encryption-password: ${DATA_ENCRYPTION_PASSWORD:default-encryption-password}
  # to rotate the encryption password we have to read all encrypted data with the old secret and then reencrypt with
  # the new one
  encryption-rotation:
    rotate-users: ${ROTATE_USER_ENCRYPTION:false}
    old-secret: ${DATA_ENCRYPTION_PASSWORD_OLD:}
    new-secret: ${DATA_ENCRYPTION_PASSWORD:}


# -----------------------------------
# Framework properties
# -----------------------------------

spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: |
        PRAGMA journal_mode=WAL;
        PRAGMA synchronous=NORMAL;
        PRAGMA cache_size=-10000;
        PRAGMA temp_store=MEMORY;
    url: jdbc:sqlite:${data.directory}/eventplanner.db
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: true
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        provider:
          default:
            issuer-uri: ${OAUTH_ISSUER_URI}
        registration:
          default:
            client-id: ${OAUTH_CLIENT_ID}
            client-secret: ${OAUTH_CLIENT_SECRET}
            provider: default
            redirect-uri: ${frontend.url}/login/oauth2/code/default
            scope:
              - openid
              - email
              - profile
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${backend.port}
  servlet:
    session:
      cookie:
        max-age: ${auth.session.timeout}
        http-only: true
        same-site: strict
        secure: true
      timeout: ${auth.session.timeout}s
  tomcat:
    threads:
      # Default is 200, taking 1MB of stack size each. As we don't need that many
      # parallel requests, we can save some memory here
      max: 50


# -----------------------------------
# Logging
# -----------------------------------

logging:
  file:
    path:
      ./logs
  level:
    root: INFO
    org.eventplanner: ${LOG_LEVEL:INFO}
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd'T'HH:mm:ss. SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr([%mdc{user:-system}]){yellow}%clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
  structured:
    format:
      console: logstash
    json:
      exclude:
        - "@version"
        - "level_value"
