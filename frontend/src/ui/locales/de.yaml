views:
  account:
    app-settings:
      language: Sprache
      language-description:
        Unterstützung für weitere Sprachen ist gerade noch in Arbeit. Du
        möchtest bei der Übersetzung aktiv mithelfen? Dann schau mal bei GitHub
        vorbei und trage zu unserem Open Source Projekt bei!
      preferred-position: Standard Position
      preferred-position-description:
        Mit welcher Position möchtest du dich standardmäßg bei Veranstaltungen
        anmelden? Du kannst deine Position für jede Anmeldung individuall
        anpassen.
      theme: Design
      title: App
    contact:
      address-description: Bitte gib deine primäre Wohnanschrift an.
      email-description:
        Deine Email Adresse wird sowohl als Kontakt Email für
        Benachrichtigungen, als auch für deinen Login verwendet. Wenn du sie
        ändern möchtest, schreib uns bitte eine Email, damit wir auch den Login
        für dich anpassen können.
      phone-description:
        'Wie können wir dich erreichen? Bitte gib mindestens eine Telefonnummer
        an: Festnetz, mobil oder dienstlich.'
      title: Kontakt Daten
    diet:
      diet-description:
        Bitte gib an, falls du dich vegetarisch oder vegan ernährst. Diese
        Information ist wichtig, damit die Kombüse ausreichend planen kann.
      intolerances-description:
        Hier kannst du Unverträglichkeiten und Allergien angeben, die der
        Kombüse bekannt sein sollten.
      kitchen-info: Informationen für die Kombüse
    emergency:
      diseases-description:
        Sollte während einer Veranstaltung etwas passieren, kann es wichtig
        sein, dass jemand an Bord über eventuelle Krankheiten informiert ist,
        die besondere Behandlungen erfordern.
      emergency-contact-description:
        Im Notfall zählt jede Sekunde. Hier kannst du eine Person hinterlegen,
        die wir im Falle eines medizinischen Notfalls oder einer anderen
        dringenden Situation kontaktieren können. Bitte gib Namen und
        Telefonnummer der Person an.
      medication-description:
        Wenn auf einer Veranstaltung mal etwas passiert, ist es wichtig, dass
        jemand an Bord weiß, welche Medikamente du benötigst.
      privacy:
        Alle Angaben sind freiwillig! Deine Daten werden verschlüsselt
        gespeichert und sind nur für autorisierte Personen einsehbar!
      title: Notfall Informationen
    personal:
      gender-description: Mit welchem Geschlecht identifizierst du dich?
      hint:
        Alle Daten, die du hier angibst, müssen genau so auch auf deinem
        Ausweisdokument stehen, da diese zum Erstellen der offiziellen Crew
        Liste verwendet werden.
      name-description:
        Dein Name, wie hier angegeben, muss genau so auch auf deinem
        Ausweisdokument stehen, da dieser zum Erstellen der offiziellen Crew
        Liste verwendet wird. Solltest du mit einem anderen Namen angesprochen
        werden wollen, kannst du einen Anzeigenamen für die App vergeben.
      nationality-description:
        Deine Nationalität wird für das Erstellen der offiziellen Crewliste
        benötigt. Solltest du mehrere Nationalitäten haben, gib hier bitte
        diejenige an, die auch auf deinem Ausweisdokumentes steht.
      nick-name-hint: Wie möchtest du angesprochen werden?
      passport-description:
        Bitte gib die Nummer eines offiziellen Ausweisdokuments an. Dies kann
        entweder dein Personalausweis oder alternativ auch dein Reisepass sein.
      passport-info:
        Bitte beachte, dass du dein eingetragenes Ausweisdokument bei allen
        Reisen mitführen musst!
      passport-link: So findest du deine Personalausweis Nummer
      title: Persönliche Daten
    tab:
      data: Meine Daten
      qualifications: Meine Qualifikationen
      settings: App Einstellungen
    title: Profil
  calendar:
    create-event: Neue Veranstaltung
    title: Alle Veranstaltungen
  event-admin-list:
    batch-edit:
      copy-slots-from: Slots kopieren von
      copy-slots-warning:
        Bereits geplante Crews werden durch das überschreiben der Slots für alle
        ausgewählten Veranstaltungen zurückgesetzt. Du musst dann alle Crews
        händisch erneut planen.
      info:
        Du kannst mehrere Reisen auf einmal bearbeiten. Dabei werden die hier
        eingegebenen Werte für alle Veranstaltungen übernommen.
      not-changed: nicht geändert
      title: Alle bearbeiten
    dialog:
      delete:
        message:
          Bist du sicher, dass du die ausgewählten {count} Veranstaltungen
          löschen möchtest? Diese Aktion kann später nicht rückgängig gemacht
          werden.
        submit: Unwiederruflich löschen
        title: Veranstaltung löschen
      open-signup:
        cancel: Nein, nur die Entwürfe
        message:
          Unter den ausgewählten Veranstaltungen ist mindestens eine, die nicht
          im Status "Entwurf" ist. Möchtest du trotzdem alle ausgewählten Reisen
          in den Status "Crew Anmeldung" ändern?
        submit: Ja, alle ändern
        title: Anmeldungen freigeben
      publish-crew:
        cancel: Nein, nur die in Anmeldung
        message:
          Unter den ausgewählten Veranstaltungen ist mindestens eine, die nicht
          im Status "Crew Anmeldung" ist. Möchtest du trotzdem alle ausgewählten
          Reisen in den Status "Crewplanung veröffentlicht" ändern?
        submit: Ja, alle ändern
        title: Crew veröffentlichen
    export: Export
    filter:
      all-events: Alle Veranstaltungen
      all-status: Alle Status
      free-slots: Freie Plätze
      search: Einträge filtern
      waitinglist: Warteliste
    state:
      free-slots-for: Freie Plätze für
      missing-crew: Crew gesucht
    tab:
      future: Zukünftige
    tab-title: Veranstaltungen verwalten
  event-confirm-participation:
    canceled:
      info:
        Deine Anmeldung wurde bereits abgesagt und du stehst nicht mehr auf der
        Crewliste. Falls du doch an der Veranstaltung teilnehmen möchtest, melde
        dich bitte telefonisch im Büro.
      title: Anmeldung wurde bereits abgesagt
    canceled-now:
      info:
        Vielen Dank für deine Rückmeldung. Schade, dass du nicht teilnehmen
        kannst. Deine Teilnahme an der Veranstaltung wurde storniert. Bitte
        versuche kurzfristige Absagen soweit möglich zu vermeiden, da es dann
        schwierig ist noch einen Ersatz für dich zu finden.
      title: Teilnahme storniert
    confirm: Ja, ich nehme teil
    confirmed:
      info:
        Vielen Dank für deine Rückmeldung. Deine Teilnahme an der Veranstaltung
        wurde als bestätigt markiert. Bitte denk daran, deine Ausweisdokumente
        und Qualifikationsnachweise im Original mitzuführen. Wir wünschen dir
        und der gesamten Crew einen angenehmen Törn und immer eine handbreit
        Wasser unterm Kiel!
      title: Teilnahme bestätigt
    decline: Ich muss leider absagen
    details:
      title: 'Hier noch einmal die wichtigsten Details zur Veranstaltung:'
    info:
      deadline: spätestens 7 Tage vor Veranstaltungsbeginn
      message:
        In {days} Tagen startet die Veranstaltung {event}, bei der du als Crew
        eingeplant bist. Bitte bestätige deine Teilnahme bis {deadline}, damit
        das Büro noch genügend Zeit hat, um gegebenenfalls einen Ersatz für dich
        zu finden.
    invalid-link:
      info:
        Der Link, mit dem du auf diese Seite gekommen bist, ist ungültig oder
        gehört zu einem anderen Nutzer. Du kannst nur deine eigenen Teilnamen
        bestätigen. Bitte überprüfe, ob die Email Adresse des Accounts, mit dem
        du dich angemeldet hast mit der Email Adresse übereinstimmt, über die du
        diesen Link erhalten hast. Wenn du weiterhin Probleme bei der
        Bestätigung hast, melde dich gerne telefonisch im Büro.
      title: Ungültiger Link
    no-registration:
      info:
        Wir haben überall gesucht, konnten für dich aber keine Anmeldung zu
        dieser Verantstaltung finden. Das kann daran liegen, dass du deine
