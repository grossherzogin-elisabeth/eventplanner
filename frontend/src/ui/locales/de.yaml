components:
  create-registration-for-user-dialog:
    note-adding-to-waiting-list:
      '{name} wird zur Warteliste der ausgewählten Veranstaltung hinzugefügt.
      Wenn {name} auch direkt zur Crew hinzugefügt werden soll, musst du die
      Veranstaltung noch manuell bearbeiten.'
  create-user-dialog:
    note-edits:
      Du kannst im Anschluss weitere Daten eingeben und alle Eingaben noch
      nachträglich bearbeiten.
  error-dialog:
    default-text:
      Ein unerwarteter Fehler ist aufgetreten. Bitte versuche es erneut.
    default-title: Unerwarteter Fehler
    details: Fehler Details
    retry: Erneut versuchen
  event-cancel-dialog:
    message:
      Bist du sicher, dass du diese Veranstaltung absagen möchtest? Aktuell wird
      vom System noch keine automatische Mail an die Crew versand. Wenn du die
      Crew über die Absage informieren möchtest, tue dies bitte bevor du die
      Veranstaltung absagst. | Bist du sicher, dass du die ausgewählten {count}
      Veranstaltungen absagen möchtest? Aktuell wird vom System noch keine
      automatische Mail an die Crews versand. Wenn du die Crews über die Absagen
      informieren möchtest, tue dies bitte bevor du die Veranstaltungen absagst.
    submit: Absagen
    title: Veranstaltung absagen | Veranstaltungen absagen
  event-create-dialog:
    description-placeholder: Kurze Beschreibung oder Zusatzinformationen
    name-placeholder: Titel der Veranstaltung
  event-details-card:
    assigned: '{count} Crew'
    registrations: '{count} Anmeldung | {count} Anmeldungen'
    title: Details
    waitinglist: '{count} Warteliste'
  event-locations-card:
    address-link: Anreiseinformationen
    learn-more: Weitere Informationen
    placeholder:
      Für diese Veranstaltung wurde noch keine Route bekannt gegeben. Sobald
      diese Informationen verfügbar sind, kannst du sie hier sehen.
  event-participants-card:
    no-registrations: Für diese Veranstaltung gibt es noch keine Anmeldungen.
    no-waitinglist: Für diese Veranstaltung gibt es aktuell keine Warteliste.
    placeholder:
      Für diese Veranstaltung hat sich bisher noch niemand angemeldet. Du kannst
      den Anfang machen und dich anmelden.
    placeholder-title: Du könntest den Anfang machen!
    placeholder-title-f: Du könntest die Erste sein!
    placeholder-title-m: Du könntest der Erste sein!
    placeholder-waiting-list-hint:
      Alle Anmeldungen werden zuerst auf der Warteliste gesammelt. Anschließend
      wird aus diesen Anmeldungen eine Crew zusammengestellt. Wenn du zur Crew
      hinzugefügt wirst, benachrichtigen wir dich per Email darüber.
  event-registration-details-card:
    title: Meine Anmeldung
  event-state-banner:
    assigned:
      Du bist für diese Veranstaltung als {signedInUserPosition} eingeplant.
    canceled: Diese Veranstaltung wurde abgesagt!
    confirmed: Du hast deine Teilnahme bestätigt.
    draft:
      Diese Veranstaltung befindet sich noch im Entwurfsstadium und ist nur für
      Nutzer mit Bearbeiten-Berechtigung sichtbar.
    missing-crew:
      'Für diese Veranstaltung wird noch Crew für die folgenden Positionen
      gesucht: {openPositions}.'
    planning:
      Diese Veranstaltung befindet sich noch in der Planung. Eine Anmeldung
      garantiert keine Teilnahme an der Veranstaltung! Sobald die Crewplanung
      veröffentlicht wird, wirst du per Email darüber informiert.
    waiting-list:
      Du stehst für diese Veranstaltung als {signedInUserPosition} auf der
      Warteliste.
  menu:
    account: Mein Profil
    calendar: Kalender
    events: Alle Veranstaltungen
    events-admin: Veranstaltungen verwalten
    home: Übersicht
    impersonate: Du siehst die Anwendung aus Sicht von {0}
    no-account:
      header: Noch kein Account?
      login: Zum Login
      message:
        Mit einem Lissi Account kannst du jederzeit den Status deiner nächsten
        Veranstaltungen einsehen und dich zu Veranstaltungen an und abmelden.
      register: Jetzt registrieren
    settings: Einstellungen
    sign-out: Abmelden
    start: Start
    stop-impersonate: Impersonate Modus beenden
    users: Nutzerliste
    users-admin: Nutzer verwalten
  registration-arrival-card:
    description:
      Bei manchen Veranstaltungen ist es möglich bereits am Vortag anzureisen.
      Bitte gib hier an, falls du bereits vorher anreisen möchtest, damit das
      Büro entsprechend planen kann.
    no: Nein, ich reise am Tag der Veranstaltung an
    note:
      Bitte beachte, das eine Übernachtung an Bord vor Veranstaltungsbeginn
      nicht garantiert werden kann.
    yes: Ja, ich möchte wenn möglich am Vortag anreisen
  registration-note-card:
    description:
      Hier kannst du zusätzliche Informationen für deine Anmeldung hinterlegen,
      die für das Büro bei der Planung relevant sein könnten.
    none: Du hast keine Notiz hinterlegt
  registration-overnight-stay-card:
    description:
      Möchtest du an Bord übernachten? Bei mehrtägigen Veranstaltungen wird
      immer von einer Übernachtung an Bord ausgegangen.
    note:
      Bitte beachte, das eine Übernachtung an Bord vor Veranstaltungsbeginn
      nicht garantiert werden kann.
  registration-position-card:
    description:
      Du hast die Qualifikation für mehrere Positionen. Mit welcher Position
      möchtest du an dieser Veranstaltung teilnehmen?
    label: Meine Position
  user-emergency-form:
    note-privacy:
      Diese Daten sind vertraulich zu behandlen und nur für den Kapitän im
      Rahmen der Reiseunterlagen bestimmt! Alle Angaben werden von der Stammcrew
      freiwillig gemacht.
    short-title: Gesundheit
    title: Wichtige gesundheitliche Informationen
  user-other-form:
    comment: Kommentar (nicht für den Nutzer einsehbar)
    diet: Ernährung
    other: Sonstiges
