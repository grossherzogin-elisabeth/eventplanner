trailingComma: es5
tabWidth: 4
printWidth: 140
semi: true
singleQuote: true
quoteProps: consistent
bracketSpacing: true
arrowParens: always
importOrder:
  - '^vue$'
  - '^vue-router$'
  - '^vue-i18n$'
  - '^vitest$'
  - '^@vue/'
  - 'msw'
  - '<THIRD_PARTY_MODULES>'
  - '^@/lib/(.*)$'
  - '^@/shared/(.*)$'
  - '^@/ctx-(.*)$'
  - '^[./]'
  - '^(.*).css$'
importOrderSeparation: false
importOrderSortSpecifiers: true
plugins:
  - '@trivago/prettier-plugin-sort-imports'
  - 'prettier-plugin-tailwindcss'
overrides:
  - files: ['*.yml', '*.yaml', '*.json']
    options:
      tabWidth: 2
  - files: ['*.yml', '*.yaml', '*.md']
    options:
      printWidth: 80
      proseWrap: always
